# @package _global_
#
# bloom-biorxiv: reference embeddings for the 20-cell multiome fixture (examples/multiome_20), produced with the
# ORIGINAL alleninstitute/bloom evaluate.py on the maintainers' GPU host from COLUMN-SORTED hyacinth-v1-format inputs
# (${oc.env:BLOOM_EVAL_INPUTS_SORTED}/multiome_20/, written by tools/make_multiome_20.py).
# Same wiring as the Phase 0/1 presets: dataset `name` eval_balanced_50_allen_multiome (feature map), MULTIOME batch
# type, mm10 reference space, batch 8, seed 42. Run twice via tools/run_evaluate_checked.py: paper-faithful
# (TF32 "medium", fused fast path on) and BLOOM_MATMUL_PRECISION=highest BLOOM_MHA_FASTPATH=0.
# Scratch preset: copy to <cfg>/experiment_evaluate/ and pass `--config-dir <cfg>`.
defaults:
  - /evaluate/reference_space@evaluate.reference_spaces.mm10: mm10
  - _self_

paths:
  embeddings: ${oc.env:BLOOM_TRAINING_DATA}/embeddings
  feature_maps: ${oc.env:BLOOM_EVAL_INPUTS_SORTED}/feature-maps   # ONE symlink -> the eval_balanced_50_allen_multiome map
  strategies: ${oc.env:BLOOM_TRAINING_DATA}/strategies

evaluate:
  precision: "32-true"
  batch_size: 8
  num_workers: 8
  seed: 42            # EvalDataset per-cell seed = seed + file_idx*100_000 + row_idx (row_idx = row in the 20-cell file)
  peak_modality: atac

  evaluation_datasets:
    multiome_20:
      name: eval_balanced_50_allen_multiome
      batch_type: MULTIOME
      reference_space: mm10
      feature_map_dir: ${paths.feature_maps}
      metadata: ${oc.env:BLOOM_EVAL_INPUTS_SORTED}/multiome_20/metadata.h5ad
      rna: ${oc.env:BLOOM_EVAL_INPUTS_SORTED}/multiome_20/rna.h5ad
      atac: ${oc.env:BLOOM_EVAL_INPUTS_SORTED}/multiome_20/atac.h5ad

  tasks:
    multiome_20_top4096:
      mode: embed
      dataset: multiome_20
      strategy:
        _target_: bloom.utils.strategy.StrategyTopExpressedGenes
        idx_file: null
        Lmax: 4096
        Lq: 128
        binarize_input_genes: true
        peak_modality: ${evaluate.peak_modality}
    multiome_20_resamp_8192_d4:
      mode: embed
      dataset: multiome_20
      strategy:
        _target_: bloom.utils.strategy.StrategyTiledPool
        feature_modality: gene
        idx_file: null
        nonzero_only: true
        draw_mode: resample
        max_draws: 4
        Lmax: 8192
        Lq: 128
        peak_modality: ${evaluate.peak_modality}
    multiome_20_resamp_atac_8192_d16:
      mode: embed
      dataset: multiome_20
      strategy:
        _target_: bloom.utils.strategy.StrategyTiledPool
        feature_modality: peak
        idx_file: null
        nonzero_only: true
        draw_mode: resample
        max_draws: 16
        Lmax: 8192
        Lq: 128
        peak_modality: ${evaluate.peak_modality}
